<title>天堂 職業技能全書</title>
<style>
  :root{
    --bg:#0c0e15; --panel:#141826; --panel2:#1b2032; --line:rgba(150,170,220,.14);
    --ink:#e9e7df; --muted:#9298b0; --faint:#6b7191;
    --accent:#5cc2ee; --accent-soft:rgba(92,194,238,.14); --accent-line:rgba(92,194,238,.5);
    --active:#5cc2ee; --active-bg:rgba(92,194,238,.12);
    --passive:#c79bf0; --passive-bg:rgba(199,155,240,.14);
    --gold:#e8c66a; --gold-bg:rgba(232,198,106,.14);
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 30px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#efe9dc; --panel:#fbf8f1; --panel2:#f4efe3; --line:rgba(60,50,30,.14);
      --ink:#26251f; --muted:#6a6656; --faint:#928d7a;
      --accent:#1f7aa8; --accent-soft:rgba(31,122,168,.1); --accent-line:rgba(31,122,168,.45);
      --active:#1f7aa8; --active-bg:rgba(31,122,168,.1);
      --passive:#7b4fb0; --passive-bg:rgba(123,79,176,.12);
      --gold:#a67c1e; --gold-bg:rgba(166,124,30,.14);
      --shadow:0 1px 0 rgba(255,255,255,.6), 0 8px 26px rgba(60,45,15,.12);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0e15; --panel:#141826; --panel2:#1b2032; --line:rgba(150,170,220,.14);
    --ink:#e9e7df; --muted:#9298b0; --faint:#6b7191;
    --accent:#5cc2ee; --accent-soft:rgba(92,194,238,.14); --accent-line:rgba(92,194,238,.5);
    --active:#5cc2ee; --active-bg:rgba(92,194,238,.12);
    --passive:#c79bf0; --passive-bg:rgba(199,155,240,.14);
    --gold:#e8c66a; --gold-bg:rgba(232,198,106,.14);
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 30px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#efe9dc; --panel:#fbf8f1; --panel2:#f4efe3; --line:rgba(60,50,30,.14);
    --ink:#26251f; --muted:#6a6656; --faint:#928d7a;
    --accent:#1f7aa8; --accent-soft:rgba(31,122,168,.1); --accent-line:rgba(31,122,168,.45);
    --active:#1f7aa8; --active-bg:rgba(31,122,168,.1);
    --passive:#7b4fb0; --passive-bg:rgba(123,79,176,.12);
    --gold:#a67c1e; --gold-bg:rgba(166,124,30,.14);
    --shadow:0 1px 0 rgba(255,255,255,.6), 0 8px 26px rgba(60,45,15,.12);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:0 20px 80px}

  header{padding:44px 0 22px}
  .eyebrow{font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600}
  h1{
    font-family:Georgia,"Songti TC","Noto Serif TC",serif;
    font-size:clamp(30px,5vw,46px); line-height:1.05; margin:.28em 0 .12em; font-weight:700;
    letter-spacing:.01em; text-wrap:balance;
  }
  .sub{color:var(--muted); max-width:66ch; font-size:15px}
  .stats{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:9px 14px; display:flex; align-items:baseline; gap:8px; box-shadow:var(--shadow)}
  .stat b{font-family:Georgia,serif; font-size:20px; font-variant-numeric:tabular-nums}
  .stat span{font-size:12px; color:var(--muted); letter-spacing:.04em}

  .controls{position:sticky; top:0; z-index:20; background:var(--bg);
    padding:14px 0 12px; margin-top:8px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:10px}
  .crow{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .search{flex:1 1 240px; position:relative; min-width:200px}
  .search input{width:100%; padding:10px 12px 10px 34px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:14px; font-family:inherit}
  .search input:focus{outline:2px solid var(--accent-line); outline-offset:1px; border-color:transparent}
  .search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--panel);
    color:var(--muted); font-size:13px; cursor:pointer; font-family:inherit; white-space:nowrap;
    font-variant-numeric:tabular-nums; transition:background .12s,color .12s,border-color .12s;
    display:inline-flex; align-items:center; gap:6px}
  .chip:hover{color:var(--ink)}
  .chip .dot{width:8px; height:8px; border-radius:50%; background:var(--jc,var(--accent))}
  .chip .n{font-size:11px; opacity:.7}
  .chip[aria-pressed="true"]{background:var(--accent-soft); color:var(--ink); border-color:var(--accent-line)}
  .chip.job[aria-pressed="true"]{background:var(--jc-soft,var(--accent-soft)); border-color:var(--jc,var(--accent-line)); color:var(--ink)}
  .chip.k-active[aria-pressed="true"]{background:var(--active-bg); color:var(--active); border-color:var(--accent-line)}
  .chip.k-passive[aria-pressed="true"]{background:var(--passive-bg); color:var(--passive); border-color:var(--passive)}

  /* Job section */
  .job-h{display:flex; align-items:center; gap:12px; margin:34px 0 12px}
  .job-badge{font-family:Georgia,serif; font-weight:700; font-size:16px; padding:0 12px; height:34px;
    display:inline-flex; align-items:center; border-radius:9px; flex:none;
    background:var(--jc-soft); color:var(--jc); border:1px solid var(--jc)}
  .job-h h2{font-size:20px; margin:0; font-weight:700; letter-spacing:.01em; font-family:Georgia,"Songti TC",serif}
  .job-h .en{color:var(--faint); font-size:13px; letter-spacing:.08em; text-transform:uppercase}
  .job-h .cnt{color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .job-h .rule{flex:1; height:1px; background:var(--line); min-width:20px}

  .tscroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:var(--shadow)}
  table{border-collapse:collapse; width:100%; min-width:1080px}
  thead th{text-align:left; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint);
    font-weight:600; padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--panel)}
  tbody td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}

  .c-icon{width:50px}
  .c-icon img{max-width:38px; max-height:38px; width:auto; height:auto; object-fit:contain;
    display:block; border-radius:7px; background:#000; border:1px solid var(--line)}
  .c-name{min-width:150px}
  .name-tw{font-weight:600; font-size:15px; line-height:1.25}
  .name-en{color:var(--accent); font-size:12.5px}
  .name-cn{color:var(--faint); font-size:12px}
  .name-ko,.name-ja{color:var(--faint); font-size:11.5px; line-height:1.35}
  .c-attr{white-space:nowrap}
  .apill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap;
    color:hsl(var(--ah) 62% 58%); background:hsl(var(--ah) 62% 52% / .15); border:1px solid hsl(var(--ah) 52% 48% / .45)}
  .ebadge{display:inline-block; margin-left:5px; padding:2px 7px; border-radius:6px; font-size:12px; font-weight:700;
    color:hsl(var(--eh) 68% 56%); background:hsl(var(--eh) 68% 52% / .16); border:1px solid hsl(var(--eh) 58% 50% / .5)}
  .c-grade{width:64px}
  .gbadge{font-family:Georgia,serif; font-weight:700; font-size:12.5px; padding:2px 8px; border-radius:7px;
    display:inline-block; background:var(--gr-bg,var(--panel2)); color:var(--gr,var(--muted)); border:1px solid var(--gr-line,var(--line)); white-space:nowrap}
  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap}
  .pill.active{background:var(--active-bg); color:var(--active)}
  .pill.passive{background:var(--passive-bg); color:var(--passive)}
  .type{font-size:13.5px; white-space:nowrap}
  .cost{font-variant-numeric:tabular-nums; white-space:nowrap; font-size:13.5px}
  .cost.none{color:var(--faint)}
  .cost .item{margin-top:4px; font-size:12px; color:var(--muted); font-variant-numeric:normal}
  .cost .ilbl{display:inline-block; font-size:10px; letter-spacing:.05em; color:var(--faint);
    border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-right:5px; vertical-align:1px}
  .dur{color:var(--muted); font-size:13.5px; white-space:nowrap}
  .c-effect{color:var(--muted); font-size:13px; line-height:1.45; min-width:220px; max-width:360px}
  .meta{color:var(--faint); font-size:11.5px; margin-top:3px}
  .empty{padding:50px; text-align:center; color:var(--faint)}
  footer{margin-top:40px; color:var(--faint); font-size:12px; line-height:1.7; border-top:1px solid var(--line); padding-top:18px}
  footer code{background:var(--panel2); padding:1px 5px; border-radius:4px; font-size:11.5px}
  @media (max-width:640px){ .c-effect{display:none} h1{font-size:30px} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Lineage · 天堂客戶端技能資料庫</div>
    <h1>職業技能全書</h1>

      </div>
    </div>
    <div class="chips" id="jobchips"></div>
  </div>

  <div id="list"></div>
  <footer id="foot"></footer>
</div>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ROWS = DATA.rows, ORDER = DATA.meta.order, JOB_EN = DATA.meta.job_en;
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDelay = ms => (ms==null) ? '—' : (+(ms/1000).toFixed(2)) + 's';
const ALIGN = {lawful:{t:'善良',h:45}, neutral:{t:'中立',h:210}, chaotic:{t:'混沌',h:2}, illusion:{t:'幻術',h:282}};
const ELEM = {fire:{t:'火',h:8}, water:{t:'水',h:200}, wind:{t:'風',h:155}, earth:{t:'地',h:35}};
const alignPill = a => (a&&ALIGN[a]) ? `<span class="apill" style="--ah:${ALIGN[a].h}">${ALIGN[a].t}</span>` : '<span style="opacity:.35">—</span>';
const elemBadge = e => (e&&ELEM[e]) ? `<span class="ebadge" style="--eh:${ELEM[e].h}">${ELEM[e].t}</span>` : '';

// per-job accent hue
const JOB_HUE = {'王族':42,'騎士':212,'妖精':142,'法師':198,'黑暗妖精':272,'龍騎士':12,'幻術師':322,'戰士':32};
function jobColor(j){ const h=JOB_HUE[j]??198; return {c:`hsl(${h} 68% 60%)`, soft:`hsl(${h} 68% 55% / .14)`, line:`hsl(${h} 55% 52% / .55)`}; }
function gradeStyle(g){
  if(g===10) return {c:'var(--gold)', bg:'var(--gold-bg)', line:'rgba(232,198,106,.4)'};
  const hue = 205 - (g-1)*16;
  return {c:`hsl(${hue} 70% 62%)`, bg:`hsl(${hue} 70% 62% / .13)`, line:`hsl(${hue} 60% 55% / .4)`};
}

// stats + job chips
const nAct = ROWS.filter(r=>r.kind==='active').length;
const nPas = ROWS.filter(r=>r.kind==='passive').length;
$('#stats').innerHTML = [['266','技能總數'],[String(nAct),'主動'],[String(nPas),'被動'],['8','職業']]
  .map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');

const jobCount = {}; ROWS.forEach(r=>jobCount[r.job]=(jobCount[r.job]||0)+1);
$('#jobchips').innerHTML =
  `<button class="chip" data-job="all" aria-pressed="true">全部職業 <span class="n">266</span></button>` +
  ORDER.map(j=>{ const c=jobColor(j);
    return `<button class="chip job" data-job="${j}" aria-pressed="false" style="--jc:${c.c};--jc-soft:${c.soft}"><span class="dot"></span>${j} <span class="n">${jobCount[j]}</span></button>`;
  }).join('');

let state = {q:'', kind:'all', job:'all'};

function render(){
  const q = state.q.trim().toLowerCase();
  const rows = ROWS.filter(r=>{
    if(state.job!=='all' && r.job!==state.job) return false;
    if(state.kind!=='all' && r.kind!==state.kind) return false;
    if(q){ const hay=[r.tw,r.cn,r.en,r.ko,r.ja,r.type,r.effect,r.target,r.catalyst].join(' ').toLowerCase();
      if(!hay.includes(q)) return false; }
    return true;
  });

  const list = $('#list');
  if(!rows.length){ list.innerHTML=`<div class="empty">找不到符合的技能</div>`; $('#foot').innerHTML=''; return; }

  const byJob = new Map();
  for(const r of rows){ if(!byJob.has(r.job)) byJob.set(r.job,[]); byJob.get(r.job).push(r); }
  const jobs = ORDER.filter(j=>byJob.has(j));

  list.innerHTML = jobs.map(job=>{
    const items = byJob.get(job);
    const a = items.filter(r=>r.kind==='active').length;
    const p = items.filter(r=>r.kind==='passive').length;
    const c = jobColor(job);
    const head = `<div class="job-h" style="--jc:${c.c};--jc-soft:${c.soft}">
        <span class="job-badge">${job}</span>
        <div><h2 style="display:inline">${job}</h2></div>
        <span class="en">${esc(JOB_EN[job]||'')}</span>
        <span class="rule"></span>
        <span class="cnt">${a} 主動 · ${p} 被動</span>
      </div>`;
    const body = items.map(r=>{
      let gcell;
      if(r.kind==='active'){ const gs=gradeStyle(r.grade);
        gcell = `<span class="gbadge" style="--gr:${gs.c};--gr-bg:${gs.bg};--gr-line:${gs.line}">${r.grade===10?'高階':r.grade+' 階'}</span>`;
      } else { gcell = `<span class="gbadge">被動</span>`; }
      const meta=[];
      if(r.levels>1) meta.push(`${r.levels} 級`);
      if(r.req) meta.push(`需 Lv.${r.req}`);
      if(r.target) meta.push(`對象：${esc(r.target)}`);
      const metaHtml = meta.length?`<div class="meta">${meta.join(' · ')}</div>`:'';
      const costCls = (r.cost==='—' && !r.catalyst)?'cost none':'cost';
      const itemHtml = r.catalyst?`<div class="item"><span class="ilbl">道具</span>${esc(r.catalyst)}</div>`:'';
      return `<tr>
        <td class="c-icon">${r.icon?`<img loading="lazy" src="${r.icon}" alt="">`:''}</td>
        <td class="c-name"><div class="name-tw">${esc(r.tw)}</div><div class="name-cn">${esc(r.cn)}</div><div class="name-en">${esc(r.en)}</div><div class="name-ko">${esc(r.ko)}</div><div class="name-ja">${esc(r.ja)}</div></td>
        <td class="c-grade">${gcell}</td>
        <td class="type">${esc(r.type)||'<span style=opacity:.4>—</span>'}</td>
        <td class="c-attr">${alignPill(r.align)}${elemBadge(r.element)}</td>
        <td class="${costCls}"><div>${esc(r.cost)}</div>${itemHtml}</td>
        <td class="dur" style="font-variant-numeric:tabular-nums">${r.range!=null?r.range+' 格':'—'}</td>
        <td class="dur">${esc(r.duration)||'—'}</td>
        <td class="dur" style="font-variant-numeric:tabular-nums">${fmtDelay(r.delay)}</td>
        <td class="c-effect">${esc(r.effect)||''}${metaHtml}</td>
      </tr>`;
    }).join('');
    return head + `<div class="tscroll"><table>
      <thead><tr><th>圖示</th><th>名稱（繁／簡／英／韓／日）</th><th>等級</th><th>類型</th><th>屬性</th><th>消耗</th><th>射程</th><th>持續時間</th><th>延遲</th><th>效果</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
  }).join('');

  $('#foot').innerHTML = `顯示 ${rows.length} / ${ROWS.length} 項技能。
    資料來源：天堂客戶端 <code>SpellList</code> / <code>passiveSpells</code> / <code>SpellDesc</code>。
    「消耗」以第 1 級為準，跨級不同者顯示範圍；「延遲」為客戶端施法/動作延遲，非伺服器冷卻時間（客戶端無 CD 資料）；「屬性」含陣營（善良/中立/混沌/幻術）與元素（火/水/風/地）；「射程」單位為格。圖示為原生尺寸（主動 38×38、被動 32×32）。部分技能原始資料缺欄位者以 — 標示。`;
}

$('#q').addEventListener('input', e=>{ state.q=e.target.value; render(); });
$('#kindchips').addEventListener('click', e=>{ const b=e.target.closest('[data-kind]'); if(!b) return;
  state.kind=b.dataset.kind; [...$('#kindchips').children].forEach(c=>c.setAttribute('aria-pressed',c===b)); render(); });
$('#jobchips').addEventListener('click', e=>{ const b=e.target.closest('[data-job]'); if(!b) return;
  state.job=b.dataset.job; [...$('#jobchips').children].forEach(c=>c.setAttribute('aria-pressed',c===b)); render(); });

render();
</script>
